name: Mirror

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  actions: write
  contents: read
  id-token: write

jobs:
  mirror:
    uses: AdGuardSoftwareLimited/actions/.github/workflows/mirror.yml@master
    with:
      team: wallet
      target_repo: git@github.com:AdguardTeam/mfa_locker.git
